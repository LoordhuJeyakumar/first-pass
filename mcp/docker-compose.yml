services:
  mcp-grafana:
    image: grafana/mcp-grafana:1.0.0
    container_name: mcp-grafana
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Environment variables read directly by mcp-grafana container binary: GRAFANA_URL, GRAFANA_SERVICE_ACCOUNT_TOKEN
    env_file:
      - ../.env

    entrypoint: ["/app/mcp-grafana", "--transport", "streamable-http", "--address", "0.0.0.0:8000"]
    command: ["--enabled-tools", "incident,dashboard,alerting,annotations,search,query,folder"]
